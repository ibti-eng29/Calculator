<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTap0BxK6nMWwY7k7exy0L5lmalN387j8xPuA&s" type="image/x-icon">
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            font-weight: 500;
            font-style: normal;
        }
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #0a0a0a, #3a4452);
        }
        .calculator{
            border: 1px solid #717377;
            padding: 20px;
            border-radius: 16px;
            background: transparent;
            box-shadow: 0px 3px 15px rgba(113, 115, 119, 0.5);
        }
        input{
            width: 320px;
            border: none;
            padding: 24px;
            margin: 10px;
            background: transparent;
            box-shadow: 0px 3px 15px rgba(84, 84, 84, 0.1);
            font-size: 40px;
            text-align: right;
            cursor: pointer;
            color: #ffffff;
        }
        input::placeholder{
            color: #ffffff;
        }
        button{
            border: none;
            width: 60px;
            height: 60px;
            margin: 10px;
            border-radius: 50%;
            background: transparent;
            color: #ffffff;
            font-size: 20px;
            box-shadow: -8px -8px 15px rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }
        button:active{
            box-shadow: inset -4px -4px 8px rgba(255,255,255,0.15);
        }
        .equalBtn{
            background-color: #fb7c14;
        }
        .operator{
            color: #6dee0a;
        }
    </style>
    <div class="calculator">
        <input type="text" placeholder="0" id="inputBox" readonly>
        <div>
            <button class="operator" data-action="clear">AC</button>
            <button class="operator" data-action="delete">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">/</button>
        </div>
        <div>
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">*</button>
        </div>
        <div>
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">-</button>
        </div>
        <div>
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>
        </div>
        <div>
            <button data-value="00">00</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equalBtn" data-action="equals">=</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('inputBox');
        const buttons = document.querySelectorAll('button');
        let expression = "";

        function updateDisplay(){
            input.value = expression || "";
            input.placeholder = "0";
        }

        function isOperator(ch){
            return ["+", "-", "*", "/", "%"].includes(ch);
        }

        function appendValue(val){
         
            if(isOperator(val) && isOperator(expression.slice(-1))){
                expression = expression.slice(0, -1) + val;
                updateDisplay();
                return;
            }
            
            if(isOperator(val) && expression === "" && val !== "-"){
                return;
            }
            // only one decimal point per number segment
            if(val === "."){
                const lastNumber = expression.split(/[\+\-\*\/%]/).pop();
                if(lastNumber.includes(".")) return;
                if(lastNumber === "") val = "0.";
            }
            expression += val;
            updateDisplay();
        }

        function calculate(){
            if(expression === "") return;
            try{
                // replace % with JS modulo-safe division for percentage use
                let safeExpr = expression.replace(/%/g, "/100");
                if(/[\+\-\*\/]$/.test(safeExpr)){
                    safeExpr = safeExpr.slice(0, -1);
                }
                
                let result = Function('"use strict"; return (' + safeExpr + ')')();
                if(result === undefined || Number.isNaN(result) || !Number.isFinite(result)){
                    expression = "Error";
                } else {
                    result = Math.round(result * 1e10) / 1e10;
                    expression = String(result);
                }
            } catch(err){
                expression = "Error";
            }
            updateDisplay();
        }

        function clearAll(){
            expression = "";
            updateDisplay();
        }

        function deleteLast(){
            if(expression === "Error"){
                expression = "";
            } else {
                expression = expression.slice(0, -1);
            }
            updateDisplay();
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const action = button.dataset.action;
                const value = button.dataset.value;
                if(action === "clear") clearAll();
                else if(action === "delete") deleteLast();
                else if(action === "equals") calculate();
                else if(value !== undefined) appendValue(value);
            });
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;

            if((key >= '0' && key <= '9')){
                appendValue(key);
                e.preventDefault();
                return;
            }
            if(['+','-','*','/','%','.'].includes(key)){
                appendValue(key);
                e.preventDefault();
                return;
            }
            if(key === 'Enter' || key === '='){
                calculate();
                e.preventDefault();
                return;
            }
            if(key === 'Backspace'){
                deleteLast();
                e.preventDefault();
                return;
            }
            if(key === 'Escape'){
                clearAll();
                e.preventDefault();
                return;
            }
        });
    </script>
</body>
</html>
